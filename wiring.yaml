# CineClear AI - Capability Wiring Index (wiring.yaml)
# Machine-readable specification of system components, agents, endpoints, and ledgers.

version: 1.2.0
updated: "2026-09-06"
system:
  name: "CineClear AI - Cinema Legal & E&O Research System"
  public_url: "https://cineclear.pro"
  judge_vip_url: "https://cineclear.pro?access=cineclear-judge-2026"
  demo_video: "https://www.youtube.com/watch?v=PgOzgVUBNso"
  host_os: "Windows 10 / 11"
  runtime: "Python 3.13"
  framework: "FastAPI + Uvicorn"
  default_port: 8085
  production: "Google Cloud Run us-central1 (service cineclear-ai)"
  ai_brain: "Google Gemini 3.8 Flash (preferred; cascade max 2 live tiers)"
  search_engine: "Parallel Semantic Search API (v1)"
  pdf_engine: "ReportLab"
  script_engine: "PyMuPDF (fitz)"
  video_engine: "OpenCV (cv2) + Pillow"
  tos_version: "2026-09-06"
  decision_support_only: true
  judge_auth_required_for_audits: true
  audit_rate_limit: "12 per hour per IP"

statutory_and_clearance_framework:
  trademark_protection:
    code: "Lanham Act (15 U.S.C. § 1114 / § 1125)"
    doctrine: "Protects against unauthorized commercial placement, trade dress infringement, and false endorsement."
  copyright_protection:
    code: "17 U.S.C. § 106 & § 501"
    doctrine: "Exclusive rights of reproduction, public display, and derivative works for visual fine art."
  architectural_safe_harbor:
    code: "17 U.S.C. § 120(a) (AWCPA)"
    doctrine: "Exempts pictorial representations of architectural works ordinarily visible from a public space."
  public_domain_cutoff:
    year: 1929
    rule: "Works published or registered before January 1, 1929 are in the worldwide public domain."
  telephony_safe_harbor:
    authority: "NANPA / FCC"
    safe_range: "555-0100 through 555-0199"
    rule: "Strict entertainment safe harbor to eliminate civil invasion of privacy liability."
  music_licensing:
    code: "17 U.S.C. § 106 & § 114"
    rule: "Dual-tier licensing required: Master Sync License (Sound Recording) + Mechanical License (Composition)."

endpoints:
  - path: "/"
    method: "GET"
    handler: "server.serve_dashboard"
    description: "Cinema dark-mode dashboard. TOS gate + Judge VIP pill. Live SSE pipeline and partner API trace."
    auth_required: false

  - path: "/health"
    method: "GET"
    handler: "server.health_check"
    description: "Health, Gemini/Parallel configured flags, tos_version, decision_support_only."
    auth_required: false

  - path: "/terms"
    method: "GET"
    handler: "server.serve_terms"
    description: "TOS / EULA: AS-IS, limitation of liability, indemnification, UPL, upload purge."
    auth_required: false

  - path: "/legal"
    method: "GET"
    handler: "server.serve_terms"
    description: "Alias of /terms."
    auth_required: false

  - path: "/favicon.ico"
    method: "GET"
    handler: "server.favicon"
    description: "Tab icon (ICO/PNG/SVG fallback)."
    auth_required: false

  - path: "/api/samples"
    method: "GET"
    handler: "server.list_sample_media"
    description: "Bundled 4K still, PDF screenplay, TXT scene metadata."
    auth_required: false

  - path: "/api/auth/verify"
    method: "GET"
    handler: "server.verify_judge_auth"
    description: "VIP_JUDGE vs PUBLIC_GUEST from X-Judge-Access, query access, or Authorization."
    auth_required: false

  - path: "/api/audit"
    method: "POST"
    handler: "server.audit_media_endpoint"
    description: "JSON 3-agent audit. Judge VIP required. Rate-limited. Purges uploads/ after."
    auth_required: true

  - path: "/api/audit/stream"
    method: "POST"
    handler: "server.audit_media_stream_endpoint"
    description: "SSE audit used by the dashboard: stage + Gemini/Parallel log frames, then complete report."
    auth_required: true

  - path: "/api/reports/{report_id}"
    method: "GET"
    handler: "server.get_report_json"
    description: "In-memory report cache (same Cloud Run instance)."
    auth_required: false

  - path: "/api/reports/{report_id}/pdf"
    method: "GET"
    handler: "server.download_report_pdf"
    description: "PDF from cache; regenerates if file missing."
    auth_required: false

  - path: "/api/reports/{report_id}/edl"
    method: "GET"
    handler: "server.download_edl_markers"
    description: "CMX 3600 EDL from cached report."
    auth_required: false

  - path: "/api/export/pdf"
    method: "POST"
    handler: "server.export_pdf_from_report"
    description: "Rebuild PDF from client report JSON (works across Cloud Run replicas)."
    auth_required: false

  - path: "/api/export/edl"
    method: "POST"
    handler: "server.export_edl_from_report"
    description: "Rebuild EDL from client report JSON."
    auth_required: false

  - path: "/static/*"
    method: "GET"
    handler: "StaticFiles Mount"
    description: "Frontend, legal.html, favicons. JS/CSS/HTML sent Cache-Control no-store."
    auth_required: false

agents_and_capabilities:
  - id: "gemini_cascade_manager"
    name: "Dynamic Model Cascade Ladder & Failover Manager"
    module: "app.gemini_cascade"
    class: "GeminiCascadeClient"
    role: "Tiered AI Failover & Rate-Limit Shield"
    ladder: ["gemini-3.8-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.6-flash", "gemini-flash-latest"]
    max_live_tiers: 2
    status: "live"
    features:
      - "Preferred model gemini-3.8-flash; at most two live cascade attempts per call"
      - "Emits Hackathon Judge Trace logs (generateContent model + 200 OK / token counts)"
      - "Local deterministic harness if all live tiers fail"

  - id: "extractor_harness"
    name: "Extractor & Ingest Harness"
    module: "app.harness"
    class: "ExtractorHarness"
    role: "Harness Boundary 1"
    status: "live"
    features:
      - "Keyframe and script entity deduplication across recurring scenes"
      - "Universal candidate normalization and timecode clamping"
      - "Protects Parallel Search and LLM token budgets"

  - id: "vision_agent"
    name: "Multimodal Vision & Keyframe Sampler (Agent 1)"
    module: "app.vision_agent"
    class: "VisionAgent"
    role: "Candidate Extraction"
    model: "gemini-3.8-flash"
    status: "live"
    features:
      - "Multi-engine screenplay parsing (PyMuPDF / pdfplumber)"
      - "Dynamic video keyframe temporal extraction (OpenCV)"
      - "High-fidelity forensic still analysis for logos, art, and PII"

  - id: "parallel_grounder"
    name: "Parallel Search Real-World Grounding Client"
    module: "app.parallel_client"
    class: "ParallelSearchClient"
    role: "Registry Grounding"
    endpoint: "https://api.parallel.ai/v1/search"
    status: "live"
    features:
      - "Live POST https://api.parallel.ai/v1/search with 8s timeout"
      - "Judge Trace logs HTTP status, result count, top title/URL"
      - "Statutory fallback corpus if live search unavailable"
      - "NANPA / USPTO / copyright-oriented objectives"

  - id: "senior_counsel_critic"
    name: "Senior Counsel Critic Agent (Agent 2)"
    module: "app.auditor"
    class: "CineClearAuditor"
    role: "Multi-Turn Reflection & Securitization"
    model: "gemini-3.8-flash"
    status: "live"
    features:
      - "Concurrent Parallel Search + Gemini synthesis (asyncio.as_completed)"
      - "Reconciles single-pass hallucinations and contradictions"
      - "Eliminates modern mark public domain misclassifications"
      - "Calibrates risk tiers (CRITICAL / HIGH / MEDIUM / LOW)"

  - id: "critic_harness"
    name: "Critic & Securitization Harness"
    module: "app.harness"
    class: "CriticHarness"
    role: "Harness Boundary 2"
    status: "live"
    features:
      - "Deterministic statutory invariant assertions"
      - "Mutual exclusivity enforcement (Active TM vs Public Domain)"
      - "Strict phone PII clamp to CRITICAL risk"
      - "Flag preservation guarantees"

  - id: "remediation_dispatcher"
    name: "Autonomous Remediation & Production Dispatcher (Agent 3)"
    module: "app.remediation_agent"
    class: "RemediationAgent"
    role: "Deliverable Generation"
    status: "live"
    deliverables:
      - "Pre-filled Form-4A Artwork Release Agreements (17 U.S.C. § 106)"
      - "Trademark Product Placement & Release Agreements (Lanham Act § 1125)"
      - "Timecoded 2D Greeking / Logo Obscure / Clean Plate VFX Work Orders"
      - "NANPA 555-01XX Script Dialogue & ADR Substitutions"

  - id: "reportlab_binder_generator"
    name: "ReportLab cinema E&O evidence dossier generator"
    module: "app.report_generator"
    handler: "generate_eo_clearance_binder"
    role: "Counsel-review PDF (not a certificate)"
    status: "live"
    features:
      - "Executive risk matrix for licensed counsel triage"
      - "UPL decision-support footer on every page"
      - "Licensed production attorney / E&O broker sign-off (gatherer, not certifier)"
      - "Parallel Search chain-of-custody citations"

  - id: "fair_use_analyzer"
    name: "4-Factor Statutory Fair Use & Multi-Territory Engine"
    module: "app.fair_use_analyzer"
    class: "FairUseAnalyzer"
    role: "Legal Defense Rubric & Jurisdiction Mapping"
    status: "live"
    features:
      - "Computes statutory 4-factor fair use defense scoring (17 U.S.C. § 107)"
      - "Evaluates multi-territory clearance compliance across US, UK, EU, and Canada"
      - "Generates defense rating pills and jurisdictional safe harbor citations"

  - id: "music_and_arch_engine"
    name: "Music Sync Clearance & AWCPA Architectural Validator"
    module: "app.music_arch_analyzer"
    class: "AWCPAValidator / MusicSyncAnalyzer"
    role: "Audio Sync & Structural Facade Rights"
    status: "live"
    features:
      - "Audits dual-tier musical rights (17 U.S.C. § 114 Master + § 106(4) Sync)"
      - "Generates industry-standard ASCAP/BMI/SESAC cue sheets"
      - "Evaluates public panorama safe harbors under 17 U.S.C. § 120(a) vs restricted trademarked/illuminated facades"

  - id: "edl_marker_exporter"
    name: "NLE Timeline Marker & CMX 3600 EDL Exporter"
    module: "app.edl_exporter"
    class: "EDLExporter"
    role: "Editorial Post-Production Integration"
    status: "live"
    features:
      - "Generates industry-standard CMX 3600 Edit Decision Lists (EDL)"
      - "Converts timecodes to 24fps frames with 2-second locator windows"
      - "Color-coded DaVinci Resolve & Adobe Premiere Pro timeline marker comments"
      - "Decision-support COMMENT header (not a clearance certificate)"

  - id: "telemetry_sink"
    name: "Hackathon Judge Partner API Trace"
    module: "app.telemetry"
    role: "SSE log frames for Gemini generateContent and Parallel POST /search"
    status: "live"

  - id: "upload_retention"
    name: "Ephemeral upload purge"
    module: "app.retention"
    role: "Delete files under uploads/ after each audit; never delete sample_media"
    status: "live"

  - id: "cli_batch_engine"
    name: "Batch Media Scanner & Terminal CLI"
    module: "main"
    role: "Headless Pipeline Execution"
    status: "live"
    features:
      - "Instant demo audit on bundled set stills (--demo)"
      - "Custom file intake (--file) for scripts, stills, and video footage"
      - "Direct PDF export and terminal rich logging"

models_and_schemas:
  - model: "RiskLevel"
    type: "Enum (str)"
    values: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
  - model: "ClearanceCategory"
    type: "Enum (str)"
    values: ["TRADEMARK_LOGO", "COPYRIGHTED_ART", "ARCHITECTURAL_RIGHTS", "MUSIC_AUDIO", "NAME_DEFAMATION", "PHONE_PII"]
  - model: "ParallelVerification"
    fields: ["search_objective", "sources_checked", "is_public_domain", "active_trademark_found", "rights_holder_identified", "statutory_context"]
  - model: "FairUseScorecard"
    fields: ["purpose_and_character", "nature_of_work", "amount_and_substantiality", "market_harm", "composite_score", "defense_rating"]
  - model: "TerritoryAssessment"
    fields: ["territory", "clearance_status", "governing_statute", "jurisdictional_notes"]
  - model: "ArchitecturalLandmarkAssessment"
    fields: ["structure_name", "jurisdiction_status", "is_public_view_safe_harbor", "governing_statute", "commercial_filing_restrictions", "clearance_recommendation"]
  - model: "ClearanceFlag"
    fields: ["id", "timestamp_or_page", "category", "detected_entity", "visual_description", "risk_level", "verification", "mitigation_action", "box_2d", "fair_use_scorecard", "territory_matrix", "arch_assessment"]
  - model: "MusicCueEntry"
    fields: ["cue_number", "track_title", "artist_performer", "composer_author", "publisher_pro", "master_rights_holder", "sync_publisher", "usage_type", "duration", "clearance_status"]
  - model: "MusicCueSheet"
    fields: ["production_title", "cue_entries", "pro_compliance_certified"]
  - model: "VFXWorkOrder"
    fields: ["timestamp_or_page", "target_entity", "action_type", "tracking_notes", "priority"]
  - model: "LegalReleaseAgreement"
    fields: ["form_type", "licensor_entity", "property_description", "governing_statute", "agreement_text"]
  - model: "ScriptFixDirective"
    fields: ["page_number", "original_text", "recommended_replacement", "rationale"]
  - model: "RemediationPackage"
    fields: ["vfx_work_orders", "legal_releases", "script_fixes", "music_cue_sheet"]
  - model: "ClearanceAuditReport"
    fields: ["id", "project_title", "media_filename", "media_type", "total_flags", "critical_count", "high_count", "medium_count", "low_count", "flags", "generated_at", "remediation_package", "pdf_report_path"]

ledgers_and_storage:
  - path: "reports/"
    format: "PDF Document Store (ReportLab)"
    role: "Permanent archive for compiled E&O Insurance Clearance Binders."
  - path: "uploads/"
    format: "Ephemeral media cache"
    role: "User uploads and temp video frames. Purged when the audit finishes."
  - path: "sample_media/"
    format: "Bundled Test Assets"
    role: "Production stills (sample_set_photo.jpg) and screenplays (sample_screenplay.pdf/.txt)."
  - path: ".env"
    format: "Key-Value Configuration"
    role: "Encrypted/local storage for GEMINI_API_KEY, PARALLEL_API_KEY, and PORT settings."
  - path: "wiring.yaml"
    format: "YAML Specification"
    role: "Complete capability wiring and component directory."
