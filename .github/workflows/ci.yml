name: CineClear AI CI Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Invariants & Diagnostics
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Doctor Diagnostic
        run: |
          python doctor.py

      - name: Run Test Suite (33 Passing Invariants)
        env:
          PYTHONPATH: "."
          GEMINI_API_KEY: "mock_gemini_key_for_ci"
          PARALLEL_API_KEY: "mock_parallel_key_for_ci"
        run: |
          python -m pytest tests/ -v
