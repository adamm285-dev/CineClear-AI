    <circle cx="245" cy="180" r="80" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6 3"/>
    <path d="M 245 125 L 300 150 L 300 205 C 300 235 245 255 245 255 C 245 255 190 235 190 205 L 190 150 Z" fill="#16a34a" fill-opacity="0.25" stroke="#22c55e" stroke-width="2.5"/>
