    <text x="45" y="293" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">SCAN COMPLETE: 3 THREATS</text>
    <text x="45" y="309" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="9">DISTRIBUTION STATUS: HALTED</text>
    <text x="45" y="324" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9">LEGAL RISK ASSESSMENT: HIGH</text>

    <!-- Scannable Insight Left -->
