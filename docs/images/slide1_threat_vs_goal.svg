    <text x="35" y="405" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" letter-spacing="1">SCANNABLE INSIGHT</text>
    <text x="35" y="428" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13.5" font-weight="500">Streaming platforms legally mandate Errors &amp; Omissions insurance.</text>
    <text x="35" y="448" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13.5" font-weight="500">Human coordinators spend 3+ weeks manually cross-referencing media.</text>
