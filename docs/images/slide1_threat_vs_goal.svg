  <text x="600" y="625" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">CINECLEAR AI // COMPRESSING 3 WEEKS OF CLEARANCE REVIEW INTO 30 SECONDS</text>
