    <text x="35" y="405" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" letter-spacing="1">SCANNABLE INSIGHT</text>
    <text x="35" y="428" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13.5" font-weight="500">A single missed background painting or real phone number halts</text>
    <text x="35" y="448" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13.5" font-weight="500">distribution immediately or triggers statutory copyright lawsuits.</text>
