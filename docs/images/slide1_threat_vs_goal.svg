    <rect x="205" y="95" width="145" height="85" rx="4" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="212" y="112" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">STATUTORY LIABILITY</text>
    <text x="212" y="126" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="8">UNLICENSED ARTWORK</text>
    <text x="212" y="138" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">// ASSET ID: PT6-3021A</text>

    <!-- Target Bounding Box 3 -->
    <rect x="295" y="210" width="145" height="75" rx="4" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="302" y="227" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">PRIVACY RISK: PII</text>
