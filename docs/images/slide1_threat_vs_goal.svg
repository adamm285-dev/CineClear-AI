    <text x="450" y="100" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">POLICY ID: <tspan fill="#38bdf8">E&amp;O-9984-XYZ</tspan></text>
    <text x="40" y="340" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">POLICY ID: E&amp;O-9984-XYZ</text>
    <text x="450" y="340" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">INSTANT SIGN-OFF: CONFIRMED</text>

    <!-- Scannable Insight Right -->
