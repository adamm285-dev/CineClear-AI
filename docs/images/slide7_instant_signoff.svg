<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="timeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg7)"/>

  <!-- Left: PDF Binder Stack Mockup -->
  <g transform="translate(80, 100)">
    <rect x="25" y="-15" width="340" height="460" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" transform="rotate(-4 170 230)"/>
    <rect x="15" y="-8" width="340" height="460" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" transform="rotate(-2 170 230)"/>
    <rect x="0" y="0" width="350" height="480" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    
    <text x="30" y="40" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ReportLab PDF Binder</text>
    <text x="30" y="65" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="900">E&amp;O Underwriting Report</text>
    <line x1="30" y1="75" x2="320" y2="75" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="30" y="100" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">Executive Risk Summary</text>
    <rect x="30" y="110" width="290" height="75" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="45" y="135" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10">Total Clearance Flags: 4</text>
    <text x="45" y="152" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Critical: 0 | High: 2 | Medium: 2</text>
    <text x="45" y="169" fill="#16a34a" font-family="system-ui, sans-serif" font-size="10">Fair Use Composite: 2.25/5.0</text>

    <rect x="30" y="200" width="290" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="30" y="215" width="270" height="6" rx="2" fill="#e2e8f0"/>
    <rect x="30" y="230" width="290" height="6" rx="2" fill="#e2e8f0"/>
    <rect x="30" y="245" width="250" height="6" rx="2" fill="#e2e8f0"/>
    
    <rect x="30" y="360" width="290" height="90" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="40" y="380" fill="#0f172a" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">UNDERWRITER SIGN-OFF BLOCK</text>
    <text x="40" y="405" fill="#475569" font-family="system-ui, sans-serif" font-size="9">E&amp;O Policy Certified: <tspan font-weight="bold">APPROVED</tspan></text>
    <text x="40" y="425" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Underwriter Signature: <tspan font-family="'JetBrains Mono', monospace" fill="#16a34a">✓ CERTIFIED E&amp;O-9984</tspan></text>
  </g>

  <!-- Right: 3 WEEKS -> 30 SECONDS Impact -->
  <g transform="translate(540, 100)">
    <text x="0" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900">Instant E&amp;O Underwriter Sign-Off</text>
    
    <text x="0" y="160" fill="url(#timeGrad)" font-family="system-ui, sans-serif" font-size="76" font-weight="900" letter-spacing="-1">3 WEEKS</text>
    <text x="0" y="240" fill="url(#timeGrad)" font-family="system-ui, sans-serif" font-size="76" font-weight="900" letter-spacing="-1">→ 30 SECONDS</text>

    <!-- Scope Box -->
    <rect x="0" y="290" width="580" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="30" cy="332" r="14" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="30" y="337" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    <text x="60" y="325" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">SCOPE:</text>
    <text x="60" y="348" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Multi-Territory compliance tracking (US, UK, EU, Canada).</text>

    <!-- Outcome Box -->
    <rect x="0" y="395" width="580" height="85" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="30" cy="437" r="14" fill="#22c55e" fill-opacity="0.2"/>
    <text x="30" y="442" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">2</text>
    <text x="60" y="430" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">OUTCOME:</text>
    <text x="60" y="453" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Court-ready legal binder with instant underwriting sign-off blocks. ✅</text>
  </g>
</svg>