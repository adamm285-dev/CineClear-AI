    <text x="25" y="120" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">Real-time semantic queries</text>
    <text x="25" y="140" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">to Parallel Search API.</text>

    <text x="25" y="190" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">OUTPUT:</text>
    <text x="25" y="215" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">Reconciles public domain claims</text>
    <text x="25" y="235" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">against USPTO/copyright DBs</text>
    <text x="25" y="255" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">&amp; computes a 4-Factor Fair</text>
    <text x="25" y="275" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Use Scorecard (17 U.S.C. § 107).</text>

    <rect x="25" y="310" width="270" height="160" rx="8" fill="#020617" stroke="#312e81" stroke-width="1"/>
    <text x="40" y="340" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11">✓ Statutory Grounding</text>
    <text x="40" y="365" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11">✓ Fair Use Composite</text>
    <text x="40" y="390" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11">✓ Multi-Territory Matrix</text>
    <text x="40" y="415" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11">✓ AWCPA § 120(a) Rules</text>
    <text x="40" y="440" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">✓ Invariant Enforcement</text>
  </g>

  <!-- Agent 3 -->
  <g transform="translate(820, 130)">
    <rect width="320" height="460" rx="12" fill="#0b1329" stroke="#38bdf8" stroke-width="2"/>
    <rect x="20" y="20" width="280" height="40" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="160" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">AGENT 3: PRODUCTION DISPATCHER</text>
    
