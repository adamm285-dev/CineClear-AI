    <text x="25" y="125" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">Automated document synthesis</text>
    <text x="25" y="145" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">&amp; cross-dept deliverable formatting.</text>

    <text x="25" y="200" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">OUTPUT:</text>
