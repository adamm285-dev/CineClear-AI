    <text x="40" y="355" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">✓ Form-4A Legal Releases</text>
    <text x="40" y="380" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">✓ VFX 2D Greeking Directives</text>
    <text x="40" y="405" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">✓ CMX 3600 EDL Export</text>
  </g>
